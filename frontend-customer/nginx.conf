server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routing (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API + SSE to the backend. The customer app authenticates
    # with an X-Session-Token header (and ?token= for SSE), which nginx forwards
    # as-is. SSE needs buffering off and long read timeouts. [RES-10]
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
